<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Little Something For You ✨</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --pink: #ff6fa9;
            --pink2: #ffb6d3;
            --purple: #a978ff;
            --white: #fff;
            --muted: rgba(255, 255, 255, .62);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            background: #050507;
            color: #fff;
            font-family: Inter, Arial, sans-serif;
        }

        /* =========================================
   BACKGROUND
========================================= */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 40%,
                    rgba(255, 80, 150, .08),
                    transparent 35%),
                radial-gradient(circle at 20% 80%,
                    rgba(132, 75, 255, .09),
                    transparent 35%),
                #050507;
        }

        .glow {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: .18;
            animation: orb 12s ease-in-out infinite alternate;
        }

        .glow.one {
            background: #ff3f91;
            left: -220px;
            top: -220px;
        }

        .glow.two {
            background: #743cff;
            right: -220px;
            bottom: -220px;
            animation-delay: -5s;
        }

        @keyframes orb {
            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(80px, 50px) scale(1.2);
            }
        }

        /* =========================================
   GRAIN
========================================= */

        .grain {
            position: fixed;
            inset: -50%;
            pointer-events: none;
            z-index: 200;
            opacity: .045;
            background-image:
                url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
            animation: grain .18s steps(2) infinite;
        }

        @keyframes grain {
            0% {
                transform: translate(0, 0)
            }

            25% {
                transform: translate(2%, 1%)
            }

            50% {
                transform: translate(-1%, 2%)
            }

            75% {
                transform: translate(1%, -2%)
            }

            100% {
                transform: translate(-2%, 1%)
            }
        }

        /* =========================================
   SCREENS
========================================= */

        .screen {
            position: fixed;
            inset: 0;
            z-index: 10;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;

            transition:
                opacity 1.1s cubic-bezier(.2, .8, .2, 1),
                transform 1.1s cubic-bezier(.2, .8, .2, 1),
                filter 1.1s ease;
        }

        .screen.hidden {
            opacity: 0;
            transform: scale(1.08);
            filter: blur(10px);
            pointer-events: none;
        }

        /* =========================================
   INTRO
========================================= */

        .intro {
            text-align: center;
            max-width: 700px;
        }

        .micro {
            font-size: 10px;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, .55);
            margin-bottom: 30px;

            animation: fadeUp 1.4s ease both;
        }

        .intro h1 {
            font-family: "Cormorant Garamond", serif;
            font-size: clamp(58px, 10vw, 105px);
            font-weight: 400;
            line-height: .85;
            letter-spacing: -4px;

            background:
                linear-gradient(120deg,
                    #fff,
                    #ffd4e5 45%,
                    #d5baff);

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            animation: fadeUp 1.5s .15s ease both;
        }

        .intro p {
            margin-top: 28px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 300;
            letter-spacing: .4px;

            animation: fadeUp 1.5s .3s ease both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================================
   START BUTTON
========================================= */

        .start {
            margin-top: 42px;

            padding: 14px 25px;

            border: 1px solid rgba(255, 255, 255, .17);
            border-radius: 100px;

            background: rgba(255, 255, 255, .07);
            color: white;

            font-family: Inter;
            font-size: 12px;
            font-weight: 500;

            cursor: pointer;

            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);

            transition:
                transform .3s ease,
                background .3s ease,
                box-shadow .3s ease;

            animation: fadeUp 1.5s .45s ease both;
        }

        .start:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, .12);
            box-shadow: 0 15px 40px rgba(255, 90, 155, .16);
        }

        .start span {
            margin-left: 8px;
        }

        /* =========================================
   COUNTDOWN
========================================= */

        .countdown {
            text-align: center;
        }

        .countdown-label {
            font-size: 10px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, .5);
            margin-bottom: 20px;
        }

        .number {
            font-size: clamp(150px, 30vw, 280px);
            font-weight: 300;
            line-height: .8;
            letter-spacing: -15px;

            background:
                linear-gradient(135deg,
                    #fff,
                    #ffafd0,
                    #b68aff);

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            filter:
                drop-shadow(0 0 60px rgba(255, 100, 170, .2));

            animation: countNumber .9s cubic-bezier(.2, .8, .2, 1);
        }

        .number.animate {
            animation: countNumber .9s cubic-bezier(.2, .8, .2, 1);
        }

        @keyframes countNumber {
            0% {
                opacity: 0;
                transform: scale(1.45);
                filter: blur(15px);
            }

            35% {
                opacity: 1;
                filter: blur(0);
            }

            100% {
                opacity: 0;
                transform: scale(.65);
            }
        }

        /* =========================================
   REVEAL SCREEN
========================================= */

        .reveal {
            text-align: center;
        }

        .reveal-label {
            font-size: 10px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, .5);
            margin-bottom: 35px;
        }

        /* =========================================
   3D GIFT
========================================= */

        .gift-scene {
            width: 280px;
            height: 250px;
            perspective: 1000px;

            display: flex;
            justify-content: center;
            align-items: center;

            margin: auto;
        }

        .gift {
            width: 150px;
            height: 120px;
            position: relative;

            transform-style: preserve-3d;

            transform:
                rotateX(12deg) rotateY(-20deg);

            transition:
                transform 1s cubic-bezier(.2, .8, .2, 1);
        }

        .gift:hover {
            transform:
                rotateX(12deg) rotateY(12deg) translateY(-8px);
        }

        /* Box */

        .box {
            position: absolute;
            width: 150px;
            height: 105px;
            bottom: 0;

            border-radius: 5px 5px 12px 12px;

            background:
                linear-gradient(135deg,
                    #ff8bb9,
                    #d72f78 60%,
                    #94194e);

            box-shadow:
                20px 30px 40px rgba(0, 0, 0, .45),
                inset 0 1px rgba(255, 255, 255, .3);
        }

        /* Ribbon */

        .box:after {
            content: "";
            position: absolute;
            left: 62px;
            top: 0;

            width: 25px;
            height: 100%;

            background:
                linear-gradient(90deg,
                    #ffd7e7,
                    #fff,
                    #ffc0da);
        }

        /* Lid */

        .lid {
            position: absolute;

            left: -10px;
            top: -20px;

            width: 170px;
            height: 32px;

            border-radius: 6px;

            background:
                linear-gradient(135deg,
                    #ff9bc4,
                    #df3b82,
                    #a8205c);

            box-shadow:
                0 15px 25px rgba(0, 0, 0, .4),
                inset 0 1px rgba(255, 255, 255, .3);

            transform-origin: left bottom;

            transition:
                transform 1.6s cubic-bezier(.16, 1, .3, 1);

            z-index: 5;
        }

        .lid:after {
            content: "";

            position: absolute;
            left: 72px;
            top: 0;

            width: 25px;
            height: 32px;

            background:
                linear-gradient(90deg,
                    #ffd7e7,
                    #fff,
                    #ffc0da);
        }

        /* Bow */

        .bow {
            position: absolute;

            width: 34px;
            height: 27px;

            left: 61px;
            top: -57px;

            border: 9px solid #ffd8e8;
            border-radius: 60% 40% 60% 40%;

            transform: rotate(-30deg);

            z-index: 10;
        }

        .bow.right {
            left: 84px;
            transform: rotate(30deg);
        }

        .bow-center {
            position: absolute;

            width: 20px;
            height: 20px;

            border-radius: 50%;

            left: 75px;
            top: -43px;

            background: #fff0f7;

            z-index: 11;
        }

        /* Glow */

        .gift-glow {
            position: absolute;

            width: 170px;
            height: 45px;

            bottom: 20px;

            border-radius: 50%;

            background: rgba(255, 75, 155, .28);

            filter: blur(30px);
        }

        /* OPEN */

        .opened .lid {
            transform:
                translate(-20px, -110px) rotate(-24deg);
        }

        .opened .gift {
            animation: giftOpening 1.1s ease;
        }

        @keyframes giftOpening {
            0% {
                transform: rotateX(12deg) rotateY(-20deg) scale(1);
            }

            40% {
                transform: rotateX(5deg) rotateY(20deg) scale(1.08);
            }

            70% {
                transform: rotateX(14deg) rotateY(-12deg) scale(1.12);
            }

            100% {
                transform: rotateX(12deg) rotateY(-20deg) scale(1);
            }
        }

        /* =========================================
   FINAL MESSAGE
========================================= */

        .final {
            text-align: center;
            overflow-y: auto;
            align-items: center;
        }

        .final-inner {
            width: min(750px, 94vw);
            padding: 50px 0 130px;
        }

        .final-micro {
            font-size: 10px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, .5);
            margin-bottom: 22px;
        }

        .final-title {
            font-family: "Great Vibes", cursive;
            font-weight: 400;
            font-size: clamp(70px, 13vw, 125px);
            line-height: .85;

            background:
                linear-gradient(135deg,
                    #fff,
                    #ffb9d5,
                    #d19aff);

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            margin-bottom: 38px;
        }

        /* =========================================
   LETTER
========================================= */

        .letter {
            text-align: left;

            padding: 35px 38px;

            border-radius: 28px;

            background:
                linear-gradient(135deg,
                    rgba(255, 255, 255, .075),
                    rgba(255, 255, 255, .025));

            border: 1px solid rgba(255, 255, 255, .13);

            -webkit-backdrop-filter: blur(30px);
            backdrop-filter: blur(30px);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, .35),
                inset 0 1px rgba(255, 255, 255, .1);
        }

        .letter-text {
            min-height: 250px;

            font-family: "Cormorant Garamond", serif;
            font-size: 23px;
            line-height: 1.7;

            color: #f5eaf0;
        }

        .cursor {
            display: inline-block;

            width: 2px;
            height: 23px;

            margin-left: 3px;

            background: #ff9fc5;

            animation: blink .8s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0
            }
        }

        .signature {
            margin-top: 22px;

            font-family: "Great Vibes", cursive;

            font-size: 34px;

            color: #ffb7d4;
        }

        /* =========================================
   MUSIC PLAYER
========================================= */

        .player {
            position: fixed;

            left: 50%;
            bottom: 20px;

            width: min(540px, 92vw);

            transform:
                translate(-50%, 120px);

            opacity: 0;

            display: flex;
            align-items: center;
            gap: 13px;

            padding: 11px 14px;

            border-radius: 20px;

            background: rgba(15, 12, 18, .72);

            border: 1px solid rgba(255, 255, 255, .13);

            -webkit-backdrop-filter: blur(25px);
            backdrop-filter: blur(25px);

            box-shadow: 0 20px 60px rgba(0, 0, 0, .4);

            transition:
                transform .8s cubic-bezier(.2, .8, .2, 1),
                opacity .8s ease;

            z-index: 100;
        }

        .player.show {
            transform: translate(-50%, 0);
            opacity: 1;
        }

        .play {
            width: 42px;
            height: 42px;

            flex-shrink: 0;

            border: none;
            border-radius: 50%;

            background:
                linear-gradient(135deg,
                    #ff5c9c,
                    #9859ff);

            color: white;

            cursor: pointer;
        }

        .track {
            flex: 1;
            min-width: 0;
        }

        .track-name {
            font-size: 11px;
            font-weight: 500;
        }

        .track-status {
            font-size: 9px;
            color: rgba(255, 255, 255, .45);
            margin-top: 3px;
        }

        .seek {
            width: 100%;
            height: 3px;

            margin-top: 8px;

            appearance: none;

            border-radius: 10px;

            background: rgba(255, 255, 255, .14);
        }

        .seek::-webkit-slider-thumb {
            appearance: none;

            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: #ff91bb;
        }

        /* =========================================
   PARTICLES
========================================= */

        .particle {
            position: fixed;

            top: -30px;

            pointer-events: none;

            z-index: 70;

            animation:
                particleFall linear forwards;
        }

        @keyframes particleFall {
            from {
                transform:
                    translateY(0) rotate(0);
                opacity: 0;
            }

            15% {
                opacity: .85;
            }

            to {
                transform:
                    translateY(110vh) rotate(540deg);
                opacity: 0;
            }
        }

        /* =========================================
   FIREWORKS
========================================= */

        #fireworks {
            position: fixed;
            inset: 0;

            pointer-events: none;

            z-index: 60;
        }

        /* =========================================
   RESPONSIVE
========================================= */

        @media(max-width:600px) {

            .intro h1 {
                letter-spacing: -2px;
            }

            .intro p {
                font-size: 12px;
                max-width: 300px;
                margin-left: auto;
                margin-right: auto;
            }

            .gift-scene {
                transform: scale(.88);
            }

            .letter {
                padding: 27px 23px;
                border-radius: 23px;
            }

            .letter-text {
                font-size: 19px;
                line-height: 1.6;
                min-height: 270px;
            }

            .signature {
                font-size: 30px;
            }

            .final-inner {
                padding-top: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="background">
        <div class="glow one"></div>
        <div class="glow two"></div>
    </div>

    <div class="grain"></div>

    <canvas id="fireworks"></canvas>


    <!-- =========================================
     SCREEN 1
========================================= -->

    <section class="screen" id="welcome">

        <div class="intro">

            <div class="micro">
                A little surprise
            </div>

            <h1>
                Made just<br>
                for you.
            </h1>

            <p>
                Take a moment. There's something waiting for you.
            </p>

            <button class="start" onclick="beginExperience()">
                Begin the surprise
                <span>→</span>
            </button>

        </div>

    </section>


    <!-- =========================================
     SCREEN 2 — COUNTDOWN
========================================= -->

    <section class="screen hidden" id="countdownScreen">

        <div class="countdown">

            <div class="countdown-label">
                Something beautiful is coming
            </div>

            <div class="number" id="countNumber">
                3
            </div>

        </div>

    </section>


    <!-- =========================================
     SCREEN 3 — GIFT
========================================= -->

    <section class="screen hidden" id="giftScreen">

        <div class="reveal">

            <div class="reveal-label">
                Your surprise is ready
            </div>

            <div class="gift-scene">

                <div class="gift-glow"></div>

                <div class="gift" id="gift">

                    <div class="box"></div>

                    <div class="lid"></div>

                    <div class="bow"></div>

                    <div class="bow right"></div>

                    <div class="bow-center"></div>

                </div>

            </div>

            <button class="start" id="revealButton" onclick="openGift()">
                Open your surprise
                <span>✦</span>
            </button>

        </div>

    </section>


    <!-- =========================================
     SCREEN 4 — FINAL
========================================= -->

    <section class="screen final hidden" id="finalScreen">

        <div class="final-inner">

            <div class="final-micro">
                Today is all about you
            </div>

            <h1 class="final-title">
                Happy Birthday
            </h1>

            <div class="letter">

                <div class="letter-text" id="letterText"></div>

                <div class="signature">
                    With lots of smiles, 💗
                </div>

            </div>

        </div>

    </section>


    <!-- =========================================
     MUSIC PLAYER
========================================= -->

    <div class="player" id="player">

        <button class="play" id="playButton" onclick="toggleMusic()">
            ▶
        </button>

        <div class="track">

            <div class="track-name">
                A little birthday soundtrack ✨
            </div>

            <div class="track-status" id="trackStatus">
                Playing...
            </div>

            <input class="seek" id="seek" type="range" min="0" max="100" value="0" aria-label="Music progress">

        </div>

    </div>


    <!-- =========================================
     AUDIO
========================================= -->

    <audio id="song" preload="auto">
        <source src="birthday-song.mp3" type="audio/mpeg">
    </audio>


    <script>

        /* =====================================================
           PERSONALIZE HERE
        ===================================================== */

        const FRIEND_NAME = "Ikhra";

        const LETTER = `Hey ${FRIEND_NAME} 💗

Happy Birthday to an absolutely wonderful friend! 🥳

I hope today brings you the kind of happiness that stays with you long after the candles are blown out.

May this new year of your life be full of beautiful moments, unexpected adventures, big dreams coming true, and countless reasons to smile.

Thank you for being the amazing person you are.

Keep shining, keep laughing, keep being yourself, and never forget just how special you are. 🌸

Here's to another year of memories, crazy conversations, laughter and unforgettable moments.

Have the most beautiful birthday ever. ✨`;


        /* =====================================================
           ELEMENTS
        ===================================================== */

        const welcome =
            document.getElementById("welcome");

        const countdownScreen =
            document.getElementById("countdownScreen");

        const giftScreen =
            document.getElementById("giftScreen");

        const finalScreen =
            document.getElementById("finalScreen");

        const countNumber =
            document.getElementById("countNumber");

        const gift =
            document.getElementById("gift");

        const revealButton =
            document.getElementById("revealButton");

        const player =
            document.getElementById("player");

        const song =
            document.getElementById("song");

        const playButton =
            document.getElementById("playButton");

        const trackStatus =
            document.getElementById("trackStatus");

        const seek =
            document.getElementById("seek");

        const letterText =
            document.getElementById("letterText");


        /* =====================================================
           SCREEN HELPERS
        ===================================================== */

        function showScreen(screen) {

            [
                welcome,
                countdownScreen,
                giftScreen,
                finalScreen
            ].forEach(s => {

                if (s === screen) {
                    s.classList.remove("hidden");
                } else {
                    s.classList.add("hidden");
                }

            });

        }


        /* =====================================================
           BEGIN
        ===================================================== */

        function beginExperience() {

            showScreen(countdownScreen);

            runCountdown();

        }


        /* =====================================================
           COUNTDOWN
        ===================================================== */

        function runCountdown() {

            let count = 3;

            countNumber.textContent = count;

            animateCount();

            const interval =
                setInterval(() => {

                    count--;

                    if (count > 0) {

                        countNumber.textContent =
                            count;

                        animateCount();

                    } else {

                        clearInterval(interval);

                        countNumber.textContent =
                            "♥";

                        animateCount();

                        setTimeout(() => {

                            showScreen(giftScreen);

                        }, 850);

                    }

                }, 1000);
        }


        function animateCount() {

            countNumber.classList.remove("animate");

            void countNumber.offsetWidth;

            countNumber.classList.add("animate");
        }


        /* =====================================================
           OPEN GIFT
        ===================================================== */

        let opened = false;

        function openGift() {

            if (opened) return;

            opened = true;

            revealButton.style.opacity = "0";
            revealButton.style.pointerEvents = "none";

            gift.classList.add("opened");

            /*
                Start music after the user's click.
            */

            startMusicPlayback();

            /*
                Celebration begins immediately.
            */

            massiveFireworks();

            createParticles();

            /*
                Cinematic transition.
            */

            setTimeout(() => {

                showScreen(finalScreen);

            }, 1900);

            setTimeout(() => {

                player.classList.add("show");

                typeLetter();

                massiveFireworks();

            }, 2700);

        }


        /* =====================================================
           TYPEWRITER
        ===================================================== */

        function typeLetter() {

            let index = 0;

            letterText.innerHTML = "";

            const cursor =
                document.createElement("span");

            cursor.className = "cursor";

            letterText.appendChild(cursor);


            function type() {

                if (index >= LETTER.length) {

                    cursor.remove();

                    return;
                }

                const character =
                    LETTER[index];

                if (character === "\n") {

                    cursor.before(
                        document.createElement("br")
                    );

                } else {

                    cursor.before(
                        document.createTextNode(character)
                    );

                }

                index++;

                let speed = 27;

                if (character === "." ||
                    character === "!") {

                    speed = 160;

                }

                if (character === "\n") {

                    speed = 280;

                }

                setTimeout(type, speed);

            }

            type();
        }


        /* =====================================================
           MUSIC
        ===================================================== */

        let fallbackAudioCtx = null;
        let fallbackGain = null;
        let fallbackTimer = null;
        let fallbackMusicActive = false;
        let fallbackOscillators = [];

        function ensureAudioContext() {

            const AudioContextClass =
                window.AudioContext ||
                window.webkitAudioContext;

            if (!AudioContextClass) return null;

            if (!fallbackAudioCtx) {

                fallbackAudioCtx = new AudioContextClass();

                fallbackGain =
                    fallbackAudioCtx.createGain();

                fallbackGain.gain.value = 0.06;
                fallbackGain.connect(
                    fallbackAudioCtx.destination
                );

            }

            if (
                fallbackAudioCtx.state === "suspended"
            ) {
                fallbackAudioCtx.resume();
            }

            return fallbackAudioCtx;
        }


        function stopFallbackMusic() {

            fallbackMusicActive = false;

            if (fallbackTimer) {
                clearInterval(fallbackTimer);
                fallbackTimer = null;
            }

            fallbackOscillators.forEach((osc) => {

                try {
                    osc.stop();
                } catch (error) {
                    // Ignore stopped oscillators.
                }

            });

            fallbackOscillators = [];

            if (fallbackGain && fallbackAudioCtx) {
                fallbackGain.gain.setTargetAtTime(
                    0.0001,
                    fallbackAudioCtx.currentTime,
                    0.04
                );
            }

        }


        function playFallbackMelody() {

            const context = ensureAudioContext();

            if (!context || !fallbackGain) {
                trackStatus.textContent =
                    "Audio not supported on this browser";
                return;
            }

            fallbackMusicActive = true;

            const melody = [
                392.0,
                523.25,
                659.25,
                783.99,
                659.25,
                523.25,
                392.0,
                440.0
            ];

            let step = 0;

            const triggerNote = () => {

                if (!fallbackMusicActive) return;

                const osc = context.createOscillator();
                const gainNode = context.createGain();

                osc.type = "sine";
                osc.frequency.value =
                    melody[step % melody.length];

                gainNode.gain.setValueAtTime(
                    0.0001,
                    context.currentTime
                );

                gainNode.gain.exponentialRampToValueAtTime(
                    0.12,
                    context.currentTime + 0.03
                );

                gainNode.gain.exponentialRampToValueAtTime(
                    0.0001,
                    context.currentTime + 0.42
                );

                osc.connect(gainNode);
                gainNode.connect(fallbackGain);

                osc.start();
                osc.stop(context.currentTime + 0.45);

                fallbackOscillators.push(osc);

                setTimeout(() => {
                    fallbackOscillators =
                        fallbackOscillators.filter(
                            item => item !== osc
                        );
                }, 500);

                step++;

            };

            triggerNote();

            fallbackTimer = setInterval(
                triggerNote,
                420
            );

        }


        function startMusicPlayback() {

            const hasRealAudioSource =
                !!song.currentSrc ||
                !!song.querySelector("source");

            if (!hasRealAudioSource) {

                stopFallbackMusic();
                playFallbackMelody();
                playButton.textContent = "❚❚";
                trackStatus.textContent =
                    "Using a built-in melody ✨";
                return;

            }

            song.volume = .7;

            song.play()
                .then(() => {

                    stopFallbackMusic();
                    playButton.textContent = "❚❚";
                    trackStatus.textContent =
                        "Now playing ✨";

                })
                .catch(() => {

                    stopFallbackMusic();
                    playFallbackMelody();
                    playButton.textContent = "❚❚";
                    trackStatus.textContent =
                        "Using a built-in melody ✨";

                });

        }


        function toggleMusic() {

            if (fallbackMusicActive) {

                stopFallbackMusic();
                playButton.textContent = "▶";
                trackStatus.textContent = "Paused";
                return;

            }

            if (song.paused) {

                startMusicPlayback();

            } else {

                song.pause();
                playButton.textContent = "▶";
                trackStatus.textContent = "Paused";

            }

        }


        song.addEventListener(
            "timeupdate",
            () => {

                if (!song.duration) return;

                seek.value =
                    (song.currentTime /
                        song.duration) * 100;

            }
        );


        seek.addEventListener(
            "input",
            () => {

                if (!song.duration) return;

                song.currentTime =
                    (seek.value / 100) *
                    song.duration;

            }
        );


        song.addEventListener(
            "ended",
            () => {

                stopFallbackMusic();
                playButton.textContent = "▶";

                trackStatus.textContent =
                    "Finished 💗";

            }
        );


        song.addEventListener(
            "error",
            () => {

                stopFallbackMusic();
                playFallbackMelody();
                playButton.textContent = "❚❚";
                trackStatus.textContent =
                    "Using a built-in melody ✨";

            }
        );


        /* =====================================================
           FLOATING PARTICLES
        ===================================================== */

        function createParticles() {

            const symbols = [
                "♡",
                "♥",
                "✦",
                "✧",
                "✿",
                "❀",
                "💗",
                "✨"
            ];

            setInterval(() => {

                const particle =
                    document.createElement("div");

                particle.className =
                    "particle";

                particle.textContent =
                    symbols[
                    Math.floor(
                        Math.random() *
                        symbols.length
                    )
                    ];

                particle.style.left =
                    Math.random() * 100 + "vw";

                particle.style.fontSize =
                    (10 + Math.random() * 18) + "px";

                particle.style.animationDuration =
                    (5 + Math.random() * 7) + "s";

                document.body.appendChild(
                    particle
                );

                setTimeout(
                    () => particle.remove(),
                    13000
                );

            }, 420);
        }


        /* =====================================================
           FIREWORK ENGINE
        ===================================================== */

        const canvas =
            document.getElementById("fireworks");

        const ctx =
            canvas.getContext("2d");

        let rockets = [];
        let sparks = [];


        function resize() {

            canvas.width =
                window.innerWidth;

            canvas.height =
                window.innerHeight;

        }

        resize();

        window.addEventListener(
            "resize",
            resize
        );


        /* Rocket */

        class Rocket {

            constructor() {

                this.x =
                    Math.random() *
                    canvas.width;

                this.y =
                    canvas.height + 20;

                this.target =
                    70 +
                    Math.random() *
                    (canvas.height * .5);

                this.speed =
                    7 + Math.random() * 3;

                this.done = false;

            }

            update() {

                this.y -= this.speed;

                if (this.y <= this.target) {

                    explode(
                        this.x,
                        this.y
                    );

                    this.done = true;

                }

            }

        }


        /* Spark */

        class Spark {

            constructor(
                x,
                y,
                vx,
                vy
            ) {

                this.x = x;
                this.y = y;

                this.vx = vx;
                this.vy = vy;

                this.life = 1;

                this.gravity = .045;

                this.size =
                    1.2 + Math.random() * 2;

            }

            update() {

                this.x += this.vx;

                this.y += this.vy;

                this.vy += this.gravity;

                this.vx *= .985;

                this.life -= .014;

            }

        }


        /* Explosion */

        function explode(x, y) {

            const amount = 90;

            for (let i = 0; i < amount; i++) {

                const angle =
                    Math.random() *
                    Math.PI * 2;

                const speed =
                    1.5 +
                    Math.random() * 5;

                sparks.push(
                    new Spark(
                        x,
                        y,
                        Math.cos(angle) * speed,
                        Math.sin(angle) * speed
                    )
                );

            }

        }


        /* Animation */

        function fireworksLoop() {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            rockets =
                rockets.filter(
                    rocket => {

                        rocket.update();

                        return !rocket.done;

                    }
                );


            const colors = [
                "#ffffff",
                "#ff8fba",
                "#ffc2dc",
                "#c79aff",
                "#ffd78c"
            ];


            sparks =
                sparks.filter(
                    spark => {

                        spark.update();

                        if (spark.life <= 0)
                            return false;


                        ctx.globalAlpha =
                            spark.life;

                        ctx.beginPath();

                        ctx.arc(
                            spark.x,
                            spark.y,
                            spark.size,
                            0,
                            Math.PI * 2
                        );

                        ctx.fillStyle =
                            colors[
                            Math.floor(
                                Math.random() *
                                colors.length
                            )
                            ];

                        ctx.fill();

                        return true;

                    }
                );


            ctx.globalAlpha = 1;

            requestAnimationFrame(
                fireworksLoop
            );

        }

        fireworksLoop();


        /* =====================================================
           FIREWORK CELEBRATION
        ===================================================== */

        function massiveFireworks() {

            /*
                First burst.
            */

            for (let i = 0; i < 12; i++) {

                setTimeout(
                    () => {
                        rockets.push(
                            new Rocket()
                        );
                    },
                    i * 180
                );

            }


            /*
                Keep fireworks going.
            */

            let rounds = 0;

            const interval =
                setInterval(() => {

                    rockets.push(
                        new Rocket()
                    );

                    rounds++;

                    if (rounds > 18) {

                        clearInterval(interval);

                    }

                }, 650);

        }

    </script>
